
name: GoREST API CI Pipeline

on: push

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Run API tests with CSV
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          test -n "$GOREST_TOKEN" || { echo "Missing GOREST_TOKEN"; exit 1; }
          newman run 2474802010412_NguyenQuocTrung_GoRest.postman_collection.json \
            -e 2474802010412_NguyenQuocTrung_GoRest_Env.postman_environment.json \
            --env-var "token=$GOREST_TOKEN" \
            -d users.csv
